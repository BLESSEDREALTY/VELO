<!DOCTYPE html>

<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELO | Move Different.</title>

<!-- ==================================================
VELO HOMEPAGE — CINEMATIC ATMOSPHERE
================================================== -->

<style>

/* ==================================================
CINEMATIC VIDEO BACKGROUND
================================================== */

.homeVideoBackground{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-3;

    opacity:.42;

    filter:
        brightness(.48)
        contrast(1.08)
        saturate(.72);

    pointer-events:none;
}


/* ==================================================
CINEMATIC VIDEO OVERLAY
================================================== */

.homeVideoOverlay{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:

        linear-gradient(
            180deg,
            rgba(5,5,5,.72) 0%,
            rgba(8,8,8,.48) 28%,
            rgba(8,8,8,.66) 58%,
            rgba(5,5,5,.94) 100%
        );

    z-index:-2;

    pointer-events:none;
}


/* ==================================================
SOULFUL VELO ATMOSPHERE
================================================== */

body.homepage{

    background:

        radial-gradient(
            circle at 50% 8%,
            rgba(212,175,55,.10),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            rgba(8,8,8,.15),
            rgba(7,7,7,.72)
        );

    position:relative;

    color:var(--white);
}


/* ==================================================
SUBTLE GOLD ATMOSPHERE
================================================== */

body.homepage::before{

    content:"";

    position:fixed;

    width:650px;
    height:650px;

    top:-300px;
    left:50%;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.09),
            transparent 68%
        );

    filter:blur(35px);

    pointer-events:none;

    z-index:-1;
}


/* ==================================================
HOMEPAGE CONTENT LAYER
================================================== */

body.homepage > *:not(.homeVideoBackground):not(.homeVideoOverlay){

    position:relative;

    z-index:1;
}


/* ==================================================
HERO ATMOSPHERE
================================================== */

.homepage .hero{

    position:relative;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding-top:140px;

    padding-bottom:100px;

}


/* ==================================================
VELO WORDMARK
================================================== */

.homepage .veloWordmark{

    display:flex;

    align-items:center;

    justify-content:center;

    gap:10px;

    width:fit-content;

    margin:0 auto;

    font-family:Arial, Helvetica, sans-serif;

    font-size:clamp(3.8rem, 12vw, 8.5rem);

    line-height:.82;

    font-weight:900;

    letter-spacing:.08em;

    color:#ffffff;

    text-shadow:
        0 15px 55px rgba(0,0,0,.85);

    white-space:nowrap;

}


/* VELO SLASH */

.homepage .veloSlash{

    display:inline-block;

    width:.10em;

    height:.82em;

    background:#ffffff;

    transform:
        skewX(-28deg)
        rotate(8deg);

    transform-origin:center;

    margin-right:.03em;

    box-shadow:
        0 0 18px rgba(255,255,255,.08);

}


/* ==================================================
PRIMARY SLOGAN
================================================== */

.homepage .primarySlogan{

    margin-top:34px;

    color:#ffffff;

    font-size:clamp(1.35rem, 4vw, 2.7rem);

    font-weight:800;

    letter-spacing:
        clamp(3px, .8vw, 8px);

    line-height:1.1;

    text-transform:uppercase;

    text-shadow:
        0 10px 35px rgba(0,0,0,.85);

}


/* ==================================================
SECONDARY BRAND PHILOSOPHY
================================================== */

.homepage .motto{

    color:var(--gold2);

    font-size:clamp(.78rem, 1.8vw, 1.15rem);

    font-weight:600;

    letter-spacing:
        clamp(2px, .5vw, 5px);

    margin-top:15px;

    line-height:1.5;

    text-transform:none;

}


/* ==================================================
HERO SUBTEXT
================================================== */

.homepage .sub-text{

    max-width:700px;

    margin-top:18px;

    color:#d0d0d0;

    line-height:1.9;

}


/* ==================================================
SOULFUL BUTTONS
================================================== */

.homepage .primary-btn,
.homepage .secondary-btn{

    position:relative;

    overflow:hidden;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;
}


.homepage .primary-btn:hover,
.homepage .secondary-btn:hover{

    transform:translateY(-4px);

    box-shadow:
        0 12px 35px
        rgba(212,175,55,.22);
}

SECTIONS

    position:relative;

    background:

            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );
