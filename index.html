<!DOCTYPE html>

<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>VELO | Velocity. Vision. Victory.</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<!-- ==================================================
VELO HOMEPAGE — CINEMATIC ATMOSPHERE
================================================== -->

<style>

/* ==================================================
CINEMATIC VIDEO BACKGROUND
================================================== */

.homeVideoBackground{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-3;

    opacity:.42;

    filter:
        brightness(.48)
        contrast(1.08)
        saturate(.72);

    pointer-events:none;
}


/* ==================================================
CINEMATIC VIDEO OVERLAY
================================================== */

.homeVideoOverlay{

    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    background:

        linear-gradient(
            180deg,
            rgba(5,5,5,.72) 0%,
            rgba(8,8,8,.48) 28%,
            rgba(8,8,8,.66) 58%,
            rgba(5,5,5,.94) 100%
        );

    z-index:-2;

    pointer-events:none;
}


/* ==================================================
SOULFUL VELO ATMOSPHERE
================================================== */

body.homepage{

    background:

        radial-gradient(
            circle at 50% 8%,
            rgba(212,175,55,.10),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            rgba(8,8,8,.15),
            rgba(7,7,7,.72)
        );

    position:relative;

    color:var(--white);
}


/* ==================================================
SUBTLE GOLD ATMOSPHERE
================================================== */

body.homepage::before{

    content:"";

    position:fixed;

    width:650px;
    height:650px;

    top:-300px;
    left:50%;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle,
            rgba(212,175,55,.09),
            transparent 68%
        );

    filter:blur(35px);

    pointer-events:none;

    z-index:-1;
}


/* ==================================================
HOMEPAGE CONTENT LAYER
================================================== */

body.homepage > *:not(.homeVideoBackground):not(.homeVideoOverlay){

    position:relative;

    z-index:1;
}


/* ==================================================
HERO ATMOSPHERE
================================================== */

.homepage .hero{

    position:relative;

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    text-align:center;

    padding-top:140px;

    padding-bottom:100px;

}


/* HERO LOGO */

.homepage .hero-image img{

    width:min(190px,45vw);

    margin:auto;

    filter:
        drop-shadow(
            0 15px 40px
            rgba(0,0,0,.65)
        );

    transition:.4s ease;
}


.homepage .hero-image img:hover{

    transform:scale(1.04);

    filter:
        drop-shadow(
            0 18px 50px
            rgba(212,175,55,.20)
        );
}


/* HERO TITLE */

.homepage .hero h1{

    margin-top:25px;

    text-shadow:
        0 15px 55px
        rgba(0,0,0,.8);
}


/* HERO MOTTO */

.homepage .motto{

    color:var(--gold2);

    font-size:1.2rem;

    font-weight:600;

    letter-spacing:4px;

    margin-top:8px;
}


/* HERO SUBTEXT */

.homepage .sub-text{

    max-width:700px;

    margin-top:15px;

    color:#d0d0d0;

    line-height:1.9;
}


/* ==================================================
SOULFUL BUTTONS
================================================== */

.homepage .primary-btn,
.homepage .secondary-btn{

    position:relative;

    overflow:hidden;

    transition:
        transform .35s ease,
        box-shadow .35s ease,
        background .35s ease;
}


.homepage .primary-btn:hover,
.homepage .secondary-btn:hover{

    transform:translateY(-4px);

    box-shadow:
        0 12px 35px
        rgba(212,175,55,.22);
}


/* ==================================================
SECTIONS
================================================== */

.homepage section:not(.hero){

    position:relative;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.035),
            rgba(255,255,255,.012)
        );

    border-top:
        1px solid
        rgba(212,175,55,.07);

}


/* ==================================================
SECTION HEADINGS
================================================== */

.homepage section h2{

    text-shadow:
        0 8px 30px
        rgba(0,0,0,.7);
}


/* ==================================================
DROP CARDS
================================================== */

.homepage .drop-card{

    background:
        linear-gradient(
            145deg,
            rgba(24,24,24,.94),
            rgba(10,10,10,.94)
        );

    border:
        1px solid
        rgba(212,175,55,.10);

    box-shadow:
        0 15px 40px
        rgba(0,0,0,.35);

}


.homepage .drop-card:hover{

    border-color:
        rgba(212,175,55,.55);

    box-shadow:
        0 22px 55px
        rgba(0,0,0,.55);
}


/* ==================================================
WHY VELO
================================================== */

.homepage .why-box{

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.045),
            rgba(255,255,255,.012)
        );

    border:
        1px solid
        rgba(255,255,255,.06);

    border-radius:20px;

    transition:.35s ease;
}


.homepage .why-box:hover{

    transform:translateY(-6px);

    border-color:
        rgba(212,175,55,.35);

    background:
        linear-gradient(
            145deg,
            rgba(212,175,55,.07),
            rgba(255,255,255,.018)
        );
}


/* ==================================================
MEMBERSHIP ATMOSPHERE
================================================== */

.homepage .membership-preview{

    background:
        radial-gradient(
            circle at center,
            rgba(212,175,55,.07),
            transparent 60%
        );
}


/* ==================================================
FOOTER
================================================== */

.homepage footer{

    position:relative;

    background:
        linear-gradient(
            180deg,
            rgba(7,7,7,.85),
            #050505
        );

}


/* ==================================================
MOBILE
================================================== */

@media(max-width:768px){

    .homeVideoBackground{

        opacity:.34;

        filter:
            brightness(.42)
            contrast(1.05)
            saturate(.65);

    }

    .homepage .hero{

        padding-top:120px;

        min-height:92vh;

    }

    .homepage .motto{

        font-size:.95rem;

        letter-spacing:2.5px;

    }

}

</style>

</head>


<body class="homepage">
